[package]
name = "stripe-webhook"
version = "0.1.0"
edition = "2024"

[lib]
name = "stripe_webhook"
path = "src/lib.rs"

[[bin]]
name = "stripe-webhook"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
lambda_http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shared = { path = "../../crates/shared" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }

[dev-dependencies]
shared = { path = "../../crates/shared", features = ["testing"] }
